<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Автобус </title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #f3f3f3;
    font-family: Arial, sans-serif;
    color: #171717;
}

.ticket {
    background: white;
    max-width: 430px;
    min-height: 100vh;
    margin: auto;
    padding: 25px 20px;
    text-align: center;
}

h1 {
    font-size: 30px;
    margin: 5px 0 35px;
}

.date {
    color: #888;
    font-size: 14px;
    margin-bottom: 20px;
}

.count {
    font-size: 46px;
    font-weight: bold;
    margin: 20px 0 25px;
}

.status {
    background: #ADDFF5;
    border-radius: 30px;
    padding: 17px;
    font-size: 17px;
    margin-bottom: 35px;
    border: none;
}


.bus {
    font-size: 25px;
    font-weight: bold;
    margin-bottom: 35px;
}
.bus-number {
    color: #000000;
    font-weight: 800;
    font-size: 26px;
    letter-spacing: 0.5px;
}

.line {
    border-top: 1px solid #ddd;
}

.qr {
    width: 210px;
    height: 210px;
    margin: 35px auto 20px;
    background: white;
    border: 9px solid #eee;
    display: grid;
    grid-template-columns: repeat(15, 1fr);
    gap: 2px;
    padding: 5px;
}

.qr span {
    background: #222;
}

.qr span.empty {
    background: white;
}

.number {
    font-size: 23px;
    font-weight: bold;
    margin: 20px;
}

.note {
    color: #888;
    font-size: 11px;
    margin-top: 30px;
}

.form {
    max-width: 430px;
    margin: 20px auto;
    background: white;
    padding: 20px;
    border-radius: 15px;
}

input {
    width: 100%;
    padding: 13px;
    margin: 8px 0 15px;
    border: 1px solid #ddd;
    border-radius: 8px;
}
select {
    width: 100%;
    padding: 13px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 16px;
    background: white;
}

button {
    width: 100%;
    padding: 15px;
    background: #222;
    color: white;
    border: none;
    border-radius: 9px;
    cursor: pointer;
}
.top-title {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
}

.brand-logo {
    width: 55px;
    height: 55px;
    border-radius: 50%;
    object-fit: cover;
}

@media print {
    body { background: white; }
    .form { display: none; }
}
</style>
</head>

<body>

<div class="ticket">

<div class="top-title">
    <img src="logo.png" class="brand-logo" alt="Мій бренд">
    <h1 id="topTransport">Автобус</h1>
</div>

<div class="date" id="date"></div>

<div class="count" id="count">1 квиток</div>

<div class="status">
    <span>Квиток дійсний</span>
    <span id="timer">60:00</span>
</div>

<span id="transportResult">Автобус</span>
№ <span id="bus" class="bus-number">0107</span>

<div class="line"></div>

<img src="my-qr.png" width="210">

<div class="number">
    Номер: <span id="number">193 213</span>
</div>

<div class="note">
</div>

</div>

<div class="form">
<h3>Налаштування макета</h3>

<label>Вид транспорту</label>
<select id="transportInput">
    <option value="Автобус"> Автобус</option>
    <option value="Трамвай"> Трамвай</option>
    <option value="Тролейбус"> Тролейбус</option>
    <option value="ЯФЕМБОЙ"> ЯФЕМБОЙ</option>
</select>

<label>Номер транспорту</label>
<input id="busInput" value="0107">

<label>Кількість</label>
<input id="countInput" type="number" min="1" max="99" value="1">

<label>Номер</label>
<input id="numberInput" value="193 213">

<button onclick="updateTicket()">сайв квиток</button>

<button onclick="window.print()" style="margin-top:10px">
найобувати не можна
</button>
</div>

<script>
function drawQR() {
    const qr = document.getElementById("qr");
    qr.innerHTML = "";

    for (let y = 0; y < 15; y++) {
        for (let x = 0; x < 15; x++) {
            const cell = document.createElement("span");
            if ((x * 7 + y * 11 + x * y) % 4 === 0) {
                cell.className = "empty";
            }
            qr.appendChild(cell);
        }
    }
}

function updateTicket() {
    const bus = document.getElementById("busInput").value.trim();
    const transport = document.getElementById("transportInput").value;
    document.getElementById("topTransport").textContent = transport;

document.getElementById("transportResult").textContent = transport;
    const count = Number(document.getElementById("countInput").value);
    const number = document.getElementById("numberInput").value.trim();

    if (!bus || !number || !Number.isInteger(count) ||
        count < 1 || count > 99) {
        alert("Перевір введені дані");
        return;
    }

    document.getElementById("bus").textContent = bus;
    document.getElementById("count").textContent =
        count + (count === 1 ? " квиток" : " квитків");
    document.getElementById("number").textContent = number;

    document.getElementById("date").textContent =
        "придбано" + new Date().toLocaleString("uk-UA", {
    day: "2-digit",
    month: "2-digit",
    year: "numeric",
    hour: "2-digit",
    minute: "2-digit"
});
}

document.getElementById("date").textContent =
    "придбано " + new Date().toLocaleString("uk-UA", {
    day: "2-digit",
    month: "2-digit",
    year: "numeric",
    hour: "2-digit",
    minute: "2-digit"
});

    let seconds = 60 * 60;

setInterval(function() {
    if (seconds > 0) {
        seconds--;
    }

    let minutes = Math.floor(seconds / 60);
    let remainingSeconds = seconds % 60;

    document.getElementById("timer").textContent =
        String(minutes).padStart(2, "0") + ":" +
        String(remainingSeconds).padStart(2, "0");

}, 1000);
drawQR();
</script>

</body>
</html>
